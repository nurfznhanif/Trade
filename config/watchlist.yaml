# ============================================================
# WATCHLIST — daftar saham yang dipantau (FOKUS: IDX)
# ============================================================
# Tiap saham punya:
#   ticker      : kode saham IDX, pakai suffix .JK (mis. BBCA.JK)
#   name        : nama buat ditampilin
#   market      : IDX
#   news_query  : kata kunci buat cari berita di Google News
#   news_lang   : id (Indonesia)
#
# Universe utama diisi OTOMATIS oleh screener (scripts/screen.py) -> focus_list.
# File ini cuma buat pin/tambah manual. US sudah TIDAK dipakai (project fokus IDX;
# diatur di trade/config.py -> MARKETS = ["IDX"]).
# ============================================================

instruments:
  - ticker: BBCA.JK
    name: Bank Central Asia
    market: IDX
    news_query: saham BBCA Bank Central Asia
    news_lang: id

  - ticker: TLKM.JK
    name: Telkom Indonesia
    market: IDX
    news_query: saham TLKM Telkom Indonesia
    news_lang: id

  - ticker: ASII.JK
    name: Astra International
    market: IDX
    news_query: saham ASII Astra International
    news_lang: id
